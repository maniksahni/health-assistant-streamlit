services:
  - type: web
    name: health-assistant-streamlit
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STREAMLIT_BROWSER_GATHERUSAGESTATS
        value: "false"
      # Prefer OpenRouter in deployment
      - key: OPENAI_PROVIDER
        value: openrouter
      # Default to a less congested free model; client will fall back across candidates
      - key: OPENAI_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      # Set these in Render dashboard (do not commit secrets); "sync: false" keeps them managed in Render
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional alternative provider key (if you switch to OpenAI)
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
